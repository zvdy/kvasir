[package]
name = "kvasir"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "LLM inference engine in Rust with hand-written CUDA kernels"
license = "Apache-2.0"
repository = "https://github.com/zvdy/kvasir"
publish = false

[dependencies]
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "cuda-13040", "dynamic-linking", "f16"] }
safetensors = "0.8"
memmap2 = "0.9"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rand = "0.10"

[[bin]]
name = "kvasir"
path = "src/bin/kvasir.rs"

[features]
gpu-tests = []

[[test]]
name = "kernels"
required-features = ["gpu-tests"]

[[test]]
name = "weights"
required-features = ["gpu-tests"]

[[test]]
name = "workspace"
required-features = ["gpu-tests"]

[[test]]
name = "kv"
required-features = ["gpu-tests"]

[[test]]
name = "forward"
required-features = ["gpu-tests"]

[[test]]
name = "cli"
required-features = ["gpu-tests"]
