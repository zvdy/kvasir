name: setup
description: Rust toolchain, CUDA driver stub and cargo cache inside the nvidia/cuda devel container

runs:
  using: composite
  steps:
    - name: System packages
      shell: bash
      run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git make build-essential
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: 1.100.0 # keep in sync with rust-toolchain.toml
        components: rustfmt, clippy
    - name: CUDA driver stub
      shell: bash
      run: ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
