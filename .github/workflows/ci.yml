name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.4.3-devel-ubuntu24.04
    env:
      CARGO_TERM_COLOR: always
      CUDA_PATH: /usr/local/cuda
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs
      LD_LIBRARY_PATH: /usr/local/cuda/lib64/stubs:/usr/local/cuda/lib64
    steps:
      - name: System packages
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git make build-essential
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - name: CUDA driver stub
        run: ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make fmt-check
      - run: make lint
      - run: make test-cpu
      - run: make doc

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          arguments: --all-features
