[package]
name = "kvasir"
version = "0.1.0"
edition = "2021"

[dependencies]
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "cuda-version-from-build-system", "dynamic-linking", "f16"] }
safetensors = "0.8"
memmap2 = "0.9"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rand = "0.9"

[[bin]]
name = "kvasir"
path = "src/bin/kvasir.rs"
