# Ordered backlog. Selection rule: first `todo` whose depends_on are all `done`. One task per run.
# status: todo | in_progress | done | blocked
# acceptance: shell commands that must exit 0 (in addition to `make ci-local`), plus criteria for the reviewer.

tasks:
  - id: ENV-weights
    title: Llama 3.2 1B weights present in models/Llama-3.2-1B
    status: done
    depends_on: []
    files: []
    acceptance:
      - test -f models/Llama-3.2-1B/model.safetensors
    notes: >
      Done 2026-11-23 (make doctor: weights=ok). model.safetensors comes from the ungated mirror unsloth/Llama-3.2-1B
      (downloaded with the maintainer's approval); its sha256
      68a2e4be76fa709455a60272fba8e512c02d81c46e6c671cc9449e374fd6809a is identical to meta-llama/Llama-3.2-1B's.
      The mirror's tokenizer.json differs in bytes from Meta's (unverified); the S1-07 logit test compares on the token
      ids in ref/out/meta.json, so it is unaffected. Canonical route for a fresh checkout: `hf auth login` with an
      approved account, then `hf download meta-llama/Llama-3.2-1B --local-dir models/Llama-3.2-1B`.

  - id: S1-01
    title: Workspace of preallocated activation buffers
    status: done
    depends_on: []
    files: [engine/src/model/workspace.rs, engine/src/model/mod.rs]
    acceptance:
      - cargo test --workspace workspace
    notes: >
      Buffers sized from LlamaConfig and max tokens per call (DESIGN §2 table). Pure size computation
      must be unit-testable on CPU (separate the size math from allocation). No allocation after `new`.

  - id: S1-02
    title: Contiguous KvCache
    status: done
    depends_on: []
    files: [engine/src/kv/mod.rs, engine/src/lib.rs, engine/tests/kv.rs, engine/Cargo.toml]
    acceptance:
      - cargo test --release --features gpu-tests --test kv
    notes: >
      K and V each [layers, n_kv, max_seq, head_dim] FP16 (DESIGN §2). Per-layer views for kv_append and
      attention. GPU test appends at several pos0 values and reads back exact positions. Register the
      test with required-features = ["gpu-tests"].

  - id: S1-03
    title: Llama forward pass (prefill and decode)
    status: done
    depends_on: [S1-01, S1-02]
    files: [engine/src/model/llama.rs, engine/src/model/mod.rs, engine/tests/forward.rs, engine/Cargo.toml]
    acceptance:
      - cargo test --release --features gpu-tests --test forward
    notes: >
      Use the existing launch wrappers in engine/src/gpu/kernels.rs and gemm.rs. Test with the tiny
      synthetic config from engine/tests/weights.rs against a CPU f32 reference forward written in the
      test; prefill of N tokens must match N sequential decodes. Thresholds justified in DESIGN.md.

  - id: S1-04
    title: Host sampling (greedy, temperature, top-p)
    status: done
    depends_on: []
    files: [engine/src/sampling.rs]
    acceptance:
      - cargo test --workspace sampling
    notes: Seeded RNG; same seed + logits gives the same token. CPU-only unit tests.

  - id: S1-05
    title: CLI `kvasir generate`
    status: done
    depends_on: [S1-03, S1-04]
    files: [engine/src/bin/kvasir.rs]
    acceptance:
      - cargo run --release -- generate --help
    notes: >
      `kvasir generate --model <dir> --prompt <text> --max-tokens N --seed S [--temperature T --top-p P]`.
      Uses tokenizers + clap (already dependencies). Prints tokens/s at the end.

  - id: S1-06
    title: HF reference dumper
    status: done
    depends_on: []
    files: [ref/dump_logits.py, ref/requirements.txt, Makefile]
    acceptance:
      - python3 -m py_compile ref/dump_logits.py
    notes: >
      Per DESIGN §6. Pinned requirements. `make ref` creates ref/.venv and writes ref/out/. Exits 0 with
      a clear message when weights are absent.

  - id: S1-07
    title: Logit-matching integration test
    status: blocked
    depends_on: [S1-03, S1-06, ENV-weights]
    files: [engine/tests/logits.rs, engine/Cargo.toml, Makefile]
    acceptance:
      - make ref
      - cargo test --release --features gpu-tests,model-tests --test logits -- --nocapture
    notes: >
      Thresholds exactly as DESIGN §6, calibrated from the HF-FP16 floor. New feature `model-tests`;
      add `make test-model`. Not part of `ci-local` until weights are routinely present.
      Blocked 2026-11-23 (draft PR, needs a human decision on DESIGN §6): logit error is at the HF-FP16 floor
      (prefill max 0.0210 vs floor 0.0256, decode max 0.0168 vs floor 0.0191, mean 0.0023/0.0021) and top-1 agrees
      at 35/35 prefill positions, but three discrete criteria fail on near-ties of the reference prompt: decode step 1
      has a reference top-2 margin of 0.0027 (kvasir prefers the runner-up by 0.0005), so decode top-1 is 15/16 and
      free-running greedy diverges at token 2; 6/35 prefill positions have margin < 0.05, above the 1% cap.
      See .agent/runs/2026-11-23-S1-07.md and DESIGN §6 "Measured".

  - id: S1-08
    title: Decode throughput benchmark vs roofline
    status: todo
    depends_on: [S1-05, ENV-weights]
    files: [engine/src/bin/kvasir.rs, DESIGN.md, bench/baseline.json]
    acceptance:
      - cargo run --release -- bench --model models/Llama-3.2-1B --json > /dev/null
    notes: >
      `kvasir bench` reports prefill and decode tok/s and % of the roofline from Weights::decode_bytes().
      Commit bench/baseline.json; later runs flag regressions > 5%.

  - id: S1-09
    title: Batch-1 decode comparison against llama.cpp and vLLM
    status: todo
    depends_on: [S1-08]
    files: [bench/compare.md, bench/compare.sh, Makefile]
    acceptance:
      - bash -n bench/compare.sh
    notes: >
      Same model (Llama 3.2 1B), FP16, same RTX 4070, batch 1, 128-token prompt, 256 generated tokens, greedy.
      `make compare` runs kvasir bench, llama.cpp `llama-bench` (F16 GGUF) and vLLM's offline throughput script when
      each is installed, skipping missing ones with a message. bench/compare.md records tok/s, % of roofline and the
      exact versions/commands. This is the scoreboard for "beat llama.cpp / vLLM".

  - id: H-01
    title: Kernel microbenchmarks with stored baseline
    status: done
    depends_on: []
    files: [engine/benches/, engine/Cargo.toml, Makefile, bench/]
    acceptance:
      - make bench
    notes: >
      Benches for each kernel at Llama dims behind the gpu-tests feature (self-contained harness, no criterion). `make bench` compares
      against bench/kernels-baseline.json and fails on > 10% regression.

  - id: A-01
    title: Flash-decoding attention kernel
    status: done
    depends_on: [H-01]
    files: [engine/kernels/attention.cu, engine/kernels/common.cuh, engine/src/gpu/kernels.rs, engine/tests/kernels.rs,
            bench/kernels-baseline.json, DESIGN.md]
    acceptance:
      - cargo test --release --features gpu-tests --test kernels
      - make bench
    notes: >
      Decode split-K over context with GQA-shared K/V loads and online softmax; tiled causal prefill. Remove the
      ~11.9k kv-length cap. Target decode ctx 2048 >= 60% of bandwidth, prefill >= 10x. Wrapper gains a `scratch`
      parameter (`attention_scratch_len`); callers outside this branch (KvCache::attention) adapt on merge.

  - id: I-01
    title: Wire flash-decoding attention into the forward pass; full-size decode bench
    status: done
    depends_on: [S1-03, A-01]
    files: [engine/src/kv/mod.rs, engine/src/model/llama.rs, engine/src/model/workspace.rs, engine/src/gpu/kernels.rs,
            engine/tests/forward.rs, engine/tests/kv.rs, engine/tests/workspace.rs, engine/tests/cli.rs,
            engine/benches/forward.rs, bench/forward-baseline.json, Makefile, DESIGN.md]
    acceptance:
      - cargo test --release --features gpu-tests --test forward --test kv --test kernels
      - make bench
    notes: >
      Workspace owns the attention scratch; Llama::new checks attention variants instead of the smem cap; alignment
      errors instead of misaligned launches. benches/forward.rs: prefill 128 and decode ms/token at ctx 128/512/2048
      vs the decode_bytes roofline, with a stored baseline. Top bottlenecks in DESIGN §8.

  - id: P-01
    title: Hand-written FP16 decode GEMV with fused epilogues instead of cuBLAS at T=1
    status: done
    depends_on: [I-01]
    files: [engine/kernels/gemv.cu, engine/src/gpu/gemm.rs, engine/src/gpu/kernels.rs, engine/src/model/llama.rs,
            engine/tests/kernels.rs, engine/benches/kernels.rs, bench/kernels-baseline.json,
            bench/forward-baseline.json, DESIGN.md, docs/adr/0007-hand-written-decode-gemv.md,
            docs/adr/0002-cublas-only-for-gemm.md]
    acceptance:
      - cargo test --release --features gpu-tests --test kernels --test forward --test cli
      - make bench
    notes: >
      gemv_f16/f32/add/silu_mul with optional fused RMSNorm prologue; T=1 layers are 7 launches. Kernel at the DRAM
      streaming rate (2.1 us + bytes/470.6 GB/s); qkv 86%, o 83%, gate_up 92%, down 89%, head 94% of 504 GB/s.
      Decode ctx 2048 5.83 -> 5.67 ms/token. ADR 0007 amends 0002. Next: PDL / rope+kv_append epilogue (DESIGN §8).

